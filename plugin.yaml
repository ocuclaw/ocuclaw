manifest_version: 1
name: ocuclaw
kind: platform
version: 2.0.5
description: >
  OcuClaw platform adapter for the hermes gateway. Spawns the shared OcuClaw
  Node runtime (glasses/phone relay, Even-AI endpoint, liveui engine) as a
  supervised child and bridges it over an NDJSON-over-stdio control link.
author: OcuClaw
# Hermes discovers the optional full-page tab from dashboard/manifest.json.
# The adjacent dashboard/README.md records the rejected frontend-toolchain
# decision and the read-only SDK discipline.
provides_tools:
  - render_glasses_ui
  - get_glasses_ui_state
  - manage_liveui_templates
  - manage_liveui_tasks
  - ocuclaw_setup
provides_hooks:
  - on_session_end
  - post_approval_response
  - pre_tool_call
  - post_tool_call
  - post_api_request
  - pre_llm_call
  # Registered ONLY on hosts whose hook vocabulary has it (0.20.5+). Hermes
  # 0.20 never consumes provides_hooks, so declaring it here is descriptive,
  # not a load-time promise; the adapter's register-time probe decides.
  - on_interim_message
  # Registered only where the host has them AND the operator opted in with
  # `plugins.stream_reasoning_deltas: true` — registering any on_stream_* hook
  # changes the provider call shape for every surface on the gateway. Still an
  # opt-in, but a GUIDED one: `/ocuclaw-setup` reports the key's state and
  # offers to write it (`enable_stream_reasoning_deltas`, `confirm: true`
  # required) rather than leaving it to a paragraph in the README.
  - on_stream_start
  - on_stream_delta
  - on_stream_end
  # Registered ONLY on hosts whose hook vocabulary has it (0.20.6+). Carries
  # the wearer's per-utterance language pick into Hermes' built-in STT
  # backends, which re-resolve language from their own config load and so
  # cannot see the overlay the `stt.transcribe` RPC hands the dispatcher.
  # Scoped to one in-flight OcuClaw transcription by a contextvar — every
  # other transcription on the gateway passes through untouched.
  - pre_transcription
